[Xiao_nrf52]
extends = nrf52_base
board = seeed-xiao-afruitnrf52-nrf52840
board_build.ldscript = boards/nrf52840_s140_v7.ld
build_flags = ${nrf52_base.build_flags}
  ${sensor_base.build_flags}
  -I lib/nrf52/s140_nrf52_7.3.0_API/include
  -I lib/nrf52/s140_nrf52_7.3.0_API/include/nrf52
  -I variants/xiao_nrf52
  -D NRF52_PLATFORM
  -D NRF52_POWER_MANAGEMENT
  -D XIAO_NRF52
  -D USE_SX1262
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D LORA_TX_POWER=22
  -D P_LORA_TX_LED=11
  -D P_LORA_DIO_1=D1
  -D P_LORA_RESET=D2
  -D P_LORA_BUSY=D3
  -D P_LORA_NSS=D4
  -D SX126X_RXEN=D5
  -D SX126X_TXEN=RADIOLIB_NC
  -D SX126X_DIO2_AS_RF_SWITCH=1
  -D SX126X_DIO3_TCXO_VOLTAGE=1.8
  -D SX126X_CURRENT_LIMIT=140
  -D SX126X_RX_BOOSTED_GAIN=1
  ; Do not -U ENV_INCLUDE_GPS in this shared section. PlatformIO emits every
  ; -U after every -D, so a child -D ENV_INCLUDE_GPS=1 cannot turn it back on.
  ; Each env that should ship without GPS undefines it itself.
  -D PIN_WIRE_SCL=D6
  -D PIN_WIRE_SDA=D7
  -D PIN_USER_BTN=PIN_BUTTON1
  -D DISPLAY_CLASS=NullDisplayDriver
build_src_filter = ${nrf52_base.build_src_filter}
  +<helpers/*.cpp>
  +<helpers/sensors>
  +<../variants/xiao_nrf52>
  +<helpers/ui/NullDisplayDriver.cpp>
debug_tool = jlink
upload_protocol = nrfutil
lib_deps = ${nrf52_base.lib_deps}
  ${sensor_base.lib_deps}

[env:Xiao_nrf52_companion_radio_ble]
extends = Xiao_nrf52
board_build.ldscript = boards/nrf52840_s140_v7_extrafs.ld
board_upload.maximum_size = 708608
build_flags =
  ${Xiao_nrf52.build_flags}
  -I examples/companion_radio/ui-orig
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D BLE_PIN_CODE=123456
  -D OFFLINE_QUEUE_SIZE=256
  ; HGLRC GPS. Module TX -> D7 (MCU RX), module RX -> D6 (MCU TX).
  ; P-channel high-side: source = XIAO 3V3, drain = module VCC, gate = D0.
  ; 100k from gate to 3V3. D0 low = on, D0 high = off. Do not also tie module VCC to 3V3.
  ; PIN_GPS_TX is the MCU RX pin (Uart::setPins takes RX, then TX).
  -D ENV_INCLUDE_GPS=1
  -D PIN_GPS_TX=D7
  -D PIN_GPS_RX=D6
  -D PIN_GPS_EN=D0
  -D PIN_GPS_EN_ACTIVE=LOW
  -D GPS_BAUD_RATE=9600
  -D ENV_SKIP_GPS_DETECT=1
  -D GPS_RELEASE_UART_WHEN_OFF=1
  ; Header UART is the GPS, so I2C stays on the module's internal sensor bus.
  -D PIN_WIRE_SDA=17
  -D PIN_WIRE_SCL=16
;  -D BLE_DEBUG_LOGGING=1
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
  -D QSPIFLASH=1
build_unflags =
  -D PIN_WIRE_SCL=D6
  -D PIN_WIRE_SDA=D7
  -D PIN_USER_BTN=PIN_BUTTON1
build_src_filter = ${Xiao_nrf52.build_src_filter}
  +<helpers/nrf52/SerialBLEInterface.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-orig/*.cpp>
lib_deps =
  ${Xiao_nrf52.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:Xiao_nrf52_companion_radio_usb]
extends = Xiao_nrf52
board_build.ldscript = boards/nrf52840_s140_v7_extrafs.ld
board_upload.maximum_size = 708608
build_flags =
  ${Xiao_nrf52.build_flags}
  -I examples/companion_radio/ui-orig
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D OFFLINE_QUEUE_SIZE=256
  -D QSPIFLASH=1
  -D ENABLE_USB_INTERFACE
  -UENV_INCLUDE_GPS
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${Xiao_nrf52.build_src_filter}
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-orig/*.cpp>
lib_deps =
  ${Xiao_nrf52.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:Xiao_nrf52_repeater]
extends = Xiao_nrf52
build_flags =
  ${Xiao_nrf52.build_flags}
  -D ADVERT_NAME='"Xiao_nrf52 Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
  -UENV_INCLUDE_GPS
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${Xiao_nrf52.build_src_filter}
  +<../examples/simple_repeater/*.cpp>

